name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DATABASE_URL: ''
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Every commit carries only the owner's name: fail on any co-author line in a commit message.
  commit-messages:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: No co-author lines in commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_HEAD"
          else
            # First push of a branch or a force-push: look at the newest commits only.
            range="-30 $PUSH_HEAD"
          fi
          fail=0
          for sha in $(git rev-list $range); do
            if git log -1 --format=%B "$sha" | grep -qiE '^[[:space:]]*co-authored-by:'; then
              echo "::error::Commit $sha has a Co-Authored-By line. Reword it without that line (see GUIDELINES.md, section 6)."
              fail=1
            fi
          done
          exit $fail

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Generate route-aware helpers before TypeScript checks on a fresh checkout.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Chromium desktop and mobile end-to-end tests
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile
